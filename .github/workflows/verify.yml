name: Verify

# The authority for every gate. Local runs are advisory; this one blocks.
# Frontend feedback is fast on Linux. The native crate runs on Windows
# because the shell and the Recycle Bin are Windows-specific.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types, invariants, tests, contrast, code map)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (Tanaw invariants and correctness)
        run: npm run lint

      - name: Text invariants in every tracked file
        run: npm run verify:text

      - name: Unit tests
        run: npm test

      - name: Token contrast
        run: npm run verify:contrast

      - name: Code map freshness
        run: npm run map:code:check

  ui:
    name: UI drive (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the drive
        run: npx playwright install --with-deps chromium

      - name: Drive the interface and capture evidence
        run: npm run verify:ui

      - name: Upload drive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-verification-evidence
          path: reports/ui-verification/**
          if-no-files-found: ignore
          retention-days: 14

  native:
    name: Native crate (cargo test, clippy)
    runs-on: windows-latest
    # The repository is named "Tanaw." and Windows strips a trailing period from
    # folder names, so the default workspace D:\a\Tanaw.\Tanaw. cannot exist and
    # actions/checkout fails. This job clones into a plain folder instead.
    # Renaming the repository to "Tanaw" removes the need for this.
    env:
      SRC: D:\tanaw
    defaults:
      run:
        working-directory: D:\tanaw
    steps:
      - name: Clone the pushed commit into a Windows-safe folder
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          git init $env:SRC
          git -C $env:SRC remote add origin "https://github.com/${{ github.repository }}.git"
          git -C $env:SRC fetch --depth 1 origin ${{ github.sha }}
          git -C $env:SRC checkout --detach FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: D:\tanaw\src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build the renderer (generate_context reads frontendDist)
        run: npm run build

      - name: Native tests
        working-directory: D:\tanaw\src-tauri
        run: cargo test --locked

      - name: Clippy with warnings denied
        working-directory: D:\tanaw\src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
